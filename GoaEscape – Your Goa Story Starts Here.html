<section><div class="w"><h2>Plan with confidence</h2><div class="grid">${[["Clear inclusions","Every package lists what is and is not included."],["Clear cancellation terms","Policies are published before you enquire."],["Human assistance","Talk to a travel planner, not a bot."],["Careful with your data","We ask only for what a quote needs."]].map(x=>`<div class="card"><div class="in"><h3>${x[0]}</h3><p style="margin:0;font-size:14px">${x[1]}</p></div></div>`).join("")}</div><p class="sm2">No reviews or customer counts are shown because none have been verified yet.</p></div></section>`}
function packages(){return `<section><div class="w"><h1>Goa Packages</h1><p class="note">Demo data. Availability is never guaranteed until the agency confirms it.</p><div class="f"><form class="fb" id="ff" aria-label="Filters"><div><label for="fc">Departure city</label><select id="fc"><option value="">All cities</option>${opts(CITIES,st.city)}</select></div><div><label for="fp">Max budget: <span id="pv">${inr(st.maxp)}</span></label><input id="fp" type="range" min="6000" max="25000" step="500" value="${st.maxp}"></div><div><label for="fd">Duration</label><select id="fd"><option value="">Any</option>${[2,3,4].map(n=>`<option value="${n}"${st.dur==n?" selected":""}>${n} nights</option>`).join("")}</select></div><div><label for="ft">Package type</label><select id="ft"><option value="">All</option>${opts([...new Set(PK.map(p=>p.ty))],st.ty)}</select></div><div><label for="fr">Region</label><select id="fr"><option value="">All</option>${opts(["North Goa","South Goa"],st.rg)}</select></div><div><label for="fw">Travelling as</label><select id="fw"><option value="">Anyone</option>${["couple","family","friends","solo"].map(x=>`<option${x===st.who?" selected":""}>${x}</option>`).join("")}</select></div><div><label for="fs">Sort by</label><select id="fs"><option value="rec">Recommended (sample order)</option><option value="pa">Price low to high</option><option value="pd">Price high to low</option><option value="ds">Shortest trip</option><option value="dl">Longest trip</option></select></div><button type="button" class="btn o" id="rs">Reset filters</button></form><div><p id="rc" aria-live="polite"></p><div class="grid g3" id="rl"></div></div></div></div></section>`}
function list(){const L=$("#rl");L.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';setTimeout(()=>{if(!$("#rl"))return;let r=PK.filter(p=>(!st.city||p.c.includes(st.city))&&p.p<=st.maxp&&(!st.dur||p.n==st.dur)&&(!st.ty||p.ty===st.ty)&&(!st.rg||p.r===st.rg)&&(!st.who||p.w.includes(st.who)));const k={pa:(a,b)=>a.p-b.p,pd:(a,b)=>b.p-a.p,ds:(a,b)=>a.n-b.n,dl:(a,b)=>b.n-a.n}[st.sort];if(k)r.sort(k);$("#rc").textContent=r.length+" package"+(r.length==1?"":"s")+" found";L.innerHTML=r.length?r.map(card).join(""):'<div class="card" style="grid-column:1/-1"><div class="in"><h3>No packages match</h3><p>Try a higher budget or reset the filters.</p></div></div>'},250)}
function detail(p){const nb=p.n+1;return `<section><div class="w"><a href="#packages">← All packages</a><h1>${esc(p.t)}</h1><div class="ph" style="height:240px;border-radius:16px;background:${bg(p)};background-size:cover;background-position:center;text-shadow:0 1px 3px #0008" role="img" aria-label="Illustration for ${esc(p.t)}">${esc(p.r)}</div><div class="f" style="grid-template-columns:1fr 320px;margin-top:24px"><div><p class="note">Sample package. Price, hotel and transport are indicative until the agency verifies them.</p><p>${esc(p.d)}</p><h2>Itinerary</h2>${Array.from({length:nb},(_,i)=>`<details${i==0?" open":""}><summary>Day ${i+1}${i==0?" – Arrive and settle in":i==nb-1?" – Relax and depart":" – "+esc(p.a[(i-1)%p.a.length])}</summary><p style="margin:8px 0 0">${i==0?"Transfer to your "+esc(p.s)+" stay. Evening free.":i==nb-1?"Breakfast, checkout and departure transfer.":"Guided activity: "+esc(p.a[(i-1)%p.a.length])+". Time to explore on your own."}</p></details>`).join("")}<div class="grid g2" style="margin:24px 0"><div><h3>Included</h3><ul><li>${nb-1} nights, ${esc(p.s)} stay</li><li>Daily breakfast</li>${p.a.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div><div><h3>Optional, paid extra</h3><ul>${p.o.map(a=>`<li>${esc(a)}</li>`).join("")}</ul><h3>Not included</h3><ul><li>Lunch and dinner</li><li>Personal expenses</li></ul></div></div><p>Departs from: ${p.c.join(", ")}. Transport is confirmed per departure. Weather-dependent activities depend on local operators and safety conditions. See <a href="#cancellation">cancellation policy</a>.</p></div>
<aside class="fb" style="position:sticky;top:96px"><div class="sm2">From (indicative)</div><div class="price">${inr(p.p)}<span class="sm2"> /person</span></div><div>${nb} days / ${p.n} nights</div><div class="sm2">Taxes and extras confirmed in the quote.</div><a class="btn" href="#enquiry" data-pk="${p.id}">Send enquiry</a></aside></div></div></section><div class="bar"><div><b class="price" style="font-size:18px">${inr(p.p)}</b> <span class="sm2">indicative</span></div><a class="btn" href="#enquiry" data-pk="${p.id}">Send enquiry</a></div>`}
function simple(t,body){return `<section><div class="w" style="max-width:820px"><h1>${esc(t)}</h1>${body}</div></section>`}
function enquiry(pk){const u=user(),today=new Date().toISOString().slice(0,10);return simple("Plan My Trip",`<p class="note">This sends an enquiry request, not a booking. Nothing is confirmed or charged. In this demo it is saved only in your browser.</p><form id="ef" novalidate class="fg"><div><label for="en">Full name *</label><input id="en" autocomplete="name" value="${u?esc(u.name):""}"><div class="er" data-e="en"></div></div><div><label for="ee">Email *</label><input id="ee" type="email" autocomplete="email" value="${u?esc(u.email):""}"><div class="er" data-e="ee"></div></div><div><label for="ep">Phone with country code *</label><input id="ep" type="tel" placeholder="+91 98765 43210" autocomplete="tel"><div class="er" data-e="ep"></div></div><div><label for="ec">Departure city *</label><select id="ec"><option value="">Select</option>${opts(CITIES)}</select><div class="er" data-e="ec"></div></div><div><label for="ed">Preferred departure date *</label><input id="ed" type="date" min="${today}"><div class="er" data-e="ed"></div></div><div><label for="er">Return date *</label><input id="er" type="date" min="${today}"><div class="er" data-e="er"></div></div><div><label for="ea">Adults *</label><input id="ea" type="number" min="1" max="12" value="2"><div class="er" data-e="ea"></div></div><div><label for="ek">Children</label><input id="ek" type="number" min="0" max="8" value="0"><div class="er" data-e="ek"></div></div><div class="full"><label for="eg">Package *</label><select id="eg"><option value="">Select</option>${PK.map(p=>`<option value="${p.id}"${p.id===pk?" selected":""}>${esc(p.t)}</option>`).join("")}<option value="custom">Custom itinerary</option></select><div class="er" data-e="eg"></div></div><div><label for="eb">Budget per person</label><select id="eb"><option>Under ₹10,000</option><option>₹10,000–₹20,000</option><option>Above ₹20,000</option></select></div><div><label for="es">Stay preference</label><select id="es"><option>Any</option><option>3-star</option><option>4-star</option><option>5-star</option></select></div><div class="full"><label for="ex">Additional requirements</label><textarea id="ex" maxlength="500"></textarea></div><div class="full"><label style="display:flex;gap:8px;align-items:flex-start"><input id="eo" type="checkbox" style="width:24px;min-height:24px"> I agree to be contacted about this enquiry and have read the <a href="#privacy">privacy policy</a>. *</label><div class="er" data-e="eo"></div></div><div class="full"><button class="btn" type="submit">Submit Enquiry</button></div></form><div id="ok"></div>`)}
function account(){const u=user();if(!u)return simple("Account",`<p class="note">Demo authentication stored in this browser only. Real security needs a server: hashed passwords, sessions in secure HttpOnly cookies, and server-side role checks. Demo admin: admin@goaescape.demo / Admin@12345.</p><div class="grid g2"><form id="lf" class="fb" novalidate><h3>Log in</h3><div><label for="le">Email</label><input id="le" type="email" autocomplete="username"></div><div><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div><div class="er" id="le2" role="alert"></div><button class="btn">Log in</button></form><form id="rf" class="fb" novalidate><h3>Create account</h3><div><label for="rn">Name</label><input id="rn" autocomplete="name"></div><div><label for="re">Email</label><input id="re" type="email" autocomplete="email"></div><div><label for="rp">Password (10+ chars, mixed case, number)</label><input id="rp" type="password" autocomplete="new-password"></div><div class="er" id="re2" role="alert"></div><button class="btn s">Sign up</button></form></div>`);
const all=Q.get()||[],mine=u.role==="admin"?all:all.filter(e=>e.by===u.email);return simple(u.role==="admin"?"Admin: all enquiries":"My enquiries",`<p>Signed in as ${esc(u.name)} (${u.role}). <button class="btn sm o" id="lo">Log out</button></p>${mine.length?`<div class="tw"><table><tr><th>Ref</th><th>Package</th><th>From</th><th>Dates</th><th>Status</th>${u.role==="admin"?"<th>Contact</th><th></th>":""}</tr>${mine.map(e=>`<tr><td>${esc(e.ref)}</td><td>${esc(e.pkg)}</td><td>${esc(e.city)}</td><td>${esc(e.dep)} to ${esc(e.ret)}</td><td>${u.role==="admin"?`<select data-st="${esc(e.ref)}" aria-label="Status">${opts(["New","Contacted","Closed"],e.status)}</select>`:esc(e.status)}</td>${u.role==="admin"?`<td>${esc(e.name)}<br>${esc(e.email)}<br>${esc(e.phone)}</td><td><button class="btn sm o" data-del="${esc(e.ref)}">Delete</button></td>`:""}</tr>`).join("")}</table></div>`:"<p>No enquiries yet. <a href='#enquiry'>Plan a trip</a>.</p>"}<p class="sm2">Booking status: an enquiry stays "New" until the agency contacts you. Nothing here is a confirmed booking.</p>`)}
function contact(){return simple("Contact Us",`<p class="note">Contact details are not configured yet. Set them in the CFG object at the top of the script.</p><ul><li>Phone: ${esc(CFG.phone||"not configured")}</li><li>Email: ${esc(CFG.email||"not configured")}</li><li>Address: ${esc(CFG.address||"not configured")}</li><li>Hours: ${esc(CFG.hours||"not configured")}</li></ul>${CFG.whatsapp?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(CFG.whatsapp)}?text=${encodeURIComponent("Hi GoaEscape, I want to plan a Goa trip.")}">WhatsApp us</a>`:'<button class="btn" disabled>WhatsApp (not configured)</button>'} <a class="btn s" href="#enquiry">Send an enquiry</a>`)}
const ROUTES={home:()=>["GoaEscape – Your Goa Story Starts Here",home()],packages:()=>["Goa Packages",packages()],experiences:()=>["Experiences",simple("Experiences",`<p class="note">Weather-dependent and regulated activities depend on local operator availability, safety conditions and applicable rules.</p><div class="grid g3">${EXP.map(x=>`<div class="card"><div class="in"><h3>${x}</h3><a href="#packages">See related packages</a></div></div>`).join("")}</div>`)],destinations:()=>["Destinations",simple("Destinations",`<div class="grid g3">${DEST.map(d=>`<div class="card"><div class="in"><h3>${d[0]}</h3><span class="tag">${d[1]} Goa</span><p style="margin:0">${d[2]}</p><a href="#packages">Related packages</a></div></div>`).join("")}</div>`)],about:()=>["About Us",simple("About Us","<p>GoaEscape plans Goa holidays for travellers from Mumbai, Pune and Kolkata. We focus on clear inclusions, honest prices and a real person to talk to.</p><p class='note'>Add real agency history, registration and team details here. None are claimed in this demo.</p>")],contact:()=>["Contact",contact()],enquiry:()=>["Plan My Trip",enquiry("")],account:()=>["Account",account()],faq:()=>["FAQ",simple("FAQ",FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join(""))]};
function render(){const h=(location.hash||"#home").slice(1);let r,pk;if(h.startsWith("pkg-")&&(pk=PK.find(p=>"pkg-"+p.id===h)))r=[pk.t,detail(pk)];else if(POL[h])r=[POL[h][0],simple(POL[h][0],`<p class="note">Sample text, to be replaced by the agency.</p><p>${POL[h][1]}</p>`)];else if(ROUTES[h])r=ROUTES[h]();else r=["Not found",simple("404 – Page not found",'<p>That page does not exist. <a href="#home">Go home</a>.</p>')];
document.title=r[0]+" | GoaEscape";$("#app").innerHTML=r[1];$("#acc").textContent=me?"My account":"Log in";document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");scrollTo(0,0);if(h==="packages")list();wire()}
function wire(){const g=id=>document.getElementById(id);
if(g("hs"))g("hs").onsubmit=e=>{e.preventDefault();st.city=g("hc").value;st.dur=g("hn").value;st.who=g("hy").value;location.hash="packages"};
if(g("ff")){const m={fc:"city",fd:"dur",ft:"ty",fr:"rg",fw:"who",fs:"sort"};Object.keys(m).forEach(i=>g(i).onchange=()=>{st[m[i]]=g(i).value;list()});g("fs").value=st.sort;g("fp").oninput=()=>{st.maxp=+g("fp").value;g("pv").textContent=inr(st.maxp);list()};g("rs").onclick=()=>{Object.assign(st,{city:"",maxp:25000,dur:"",ty:"",rg:"",who:"",sort:"rec"});render()}}
if(g("ef"))g("ef").onsubmit=submitEnq;
if(g("lf"))g("lf").onsubmit=login;if(g("rf"))g("rf").onsubmit=signup;
if(g("lo"))g("lo").onclick=()=>{me=null;try{sessionStorage.removeItem("ge_me")}catch(e){}render()};
document.querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>{if(user()?.role!=="admin")return;const a=Q.get();a.find(e=>e.ref===s.dataset.st).status=s.value;Q.set(a);toast("Status updated")});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(user()?.role!=="admin")return;Q.set(Q.get().filter(e=>e.ref!==b.dataset.del));render()})}
function submitEnq(e){e.preventDefault();const v=i=>document.getElementById(i).value.trim(),er={};
if(v("en").length<2)er.en="Enter your full name.";if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("ee")))er.ee="Enter a valid email.";if(!/^\+\d{1,3}[\s-]?\d{6,12}$/.test(v("ep").replace(/\s{2,}/g," ")))er.ep="Use country code, like +91 98765 43210.";if(!v("ec"))er.ec="Choose a departure city.";
const d=v("ed"),r=v("er"),t=new Date().toISOString().slice(0,10);if(!d||d<t)er.ed="Pick a date today or later.";if(!r||r<=d)er.er="Return must be after departure.";
const a=+v("ea"),k=+v("ek");if(!(a>=1&&a<=12))er.ea="1 to 12 adults.";if(!(k>=0&&k<=8))er.ek="0 to 8 children.";if(a+k>16)er.ek="Max 16 travellers.";
const pk=v("eg"),P=PK.find(p=>p.id===pk);if(!pk)er.eg="Choose a package.";else if(P&&v("ec")&&!P.c.includes(v("ec")))er.eg=P.t+" is not planned from "+v("ec")+".";
if(!document.getElementById("eo").checked)er.eo="Consent is required.";
document.querySelectorAll("[data-e]").forEach(x=>x.textContent=er[x.dataset.e]||"");const first=Object.keys(er)[0];if(first){document.getElementById(first).focus();return}
const ref="DEMO-"+bytes(crypto.getRandomValues(new Uint8Array(3))).toUpperCase(),q=Q.get()||[];q.push({ref,by:me||"guest",name:v("en"),email:v("ee"),phone:v("ep"),city:v("ec"),dep:d,ret:r,pkg:P?P.t:"Custom itinerary",status:"New"});Q.set(q);
document.getElementById("ef").style.display="none";document.getElementById("ok").innerHTML=`<div class="note" role="status" style="border-color:var(--ok)"><b>Enquiry received (demo).</b> Reference ${ref}. This is a request, not a confirmed booking. A real site would send it to the agency’s server.</div>`}
async function login(e){e.preventDefault();const o=document.getElementById("le2");if(Date.now()<lock){o.textContent="Too many attempts. Wait 30 seconds.";return}const em=document.getElementById("le").value.trim().toLowerCase(),u=(U.get()||[]).find(x=>x.email===em),h=u?await hash(document.getElementById("lp").value,u.salt):"";
if(u&&h===u.hash){fails=0;me=u.email;try{sessionStorage.setItem("ge_me",me)}catch(x){}render();toast("Welcome, "+u.name)}else{if(++fails>=5){lock=Date.now()+30000;fails=0}o.textContent="Email or password is incorrect."}}
async function signup(e){e.preventDefault();const o=document.getElementById("re2"),n=document.getElementById("rn").value.trim(),em=document.getElementById("re").value.trim().toLowerCase(),pw=document.getElementById("rp").value,u=U.get()||[];
if(n.length<2||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){o.textContent="Enter your name and a valid email.";return}if(pw.length<10||!/[a-z]/.test(pw)||!/[A-Z]/.test(pw)||!/\d/.test(pw)){o.textContent="Password needs 10+ characters with upper, lower and a number.";return}if(u.find(x=>x.email===em)){o.textContent="That email is already registered.";return}
const salt=bytes(crypto.getRandomValues(new Uint8Array(8)));u.push({email:em,name:n,salt,hash:await hash(pw,salt),role:"customer"});U.set(u);me=em;try{sessionStorage.setItem("ge_me",me)}catch(x){}render();toast("Account created")}
document.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;if(a.dataset.city){st.city=a.dataset.city}if(a.dataset.pk){window.__pk=a.dataset.pk;setTimeout(()=>{const s=document.getElementById("eg");if(s)s.value=window.__pk},0)}});
$("#mb").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o);$("#mb").setAttribute("aria-label",o?"Close menu":"Open menu")};
addEventListener("hashchange",render);seed().then(render);
</script></body></html>
